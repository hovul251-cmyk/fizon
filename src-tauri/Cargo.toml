[package]
name = "fizion"
version = "0.10.0"
description = "Fizion — мессенджер для сообществ"
edition = "2021"

[lib]
name = "fizion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
# открыть ссылку в браузере (на Android — скачать новую версию APK)
tauri-plugin-opener = "2"
serde_json = "1.0.154"

# только для компьютера: трей, автозапуск, одно окно, автообновление
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Маленький и быстрый .exe в релизе
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
